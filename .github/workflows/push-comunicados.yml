name: Avisos push dos comunicados

on:
  push:
    branches: [main]
    paths: ['dados/comunicados.json']
  workflow_dispatch:
    inputs:
      numero:
        description: 'Número do comunicado a reenviar (ex.: 2026-003)'
        required: true

concurrency:
  group: push-comunicados
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versão anterior dos comunicados
        run: |
          ANTES="${{ github.event.before }}"
          if [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$ANTES" 2>/dev/null; then
            git show "$ANTES:dados/comunicados.json" > /tmp/anterior.json 2>/dev/null || : > /tmp/anterior.json
          else
            git show HEAD~1:dados/comunicados.json > /tmp/anterior.json 2>/dev/null || : > /tmp/anterior.json
          fi
      - name: Enviar avisos
        env:
          ONESIGNAL_APP_ID: 409b77e2-8002-4409-80d6-816e93f5c787
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python3 scripts/enviar_push.py /tmp/anterior.json dados/comunicados.json "${{ github.event.inputs.numero }}"
