name: Avisos push do app

on:
  push:
    branches: [main]
    paths: ['dados/**', 'index.html']
  workflow_dispatch:
    inputs:
      numero:
        description: 'Número do comunicado a reenviar (ex.: 2026-003). Deixe vazio para aviso de teste.'
        required: false
      teste:
        description: 'Enviar aviso de teste (ignora o número)'
        type: boolean
        default: false

concurrency:
  group: push-app
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enviar avisos das novidades
        env:
          ONESIGNAL_APP_ID: 409b77e2-8002-4409-80d6-816e93f5c787
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ANTES: ${{ github.event.before }}
          MSG: ${{ github.event.head_commit.message }}
          NUMERO: ${{ github.event.inputs.numero }}
          TESTE: ${{ github.event.inputs.teste }}
        run: |
          if [ "$TESTE" = "true" ]; then
            python3 scripts/enviar_push.py --teste
          elif [ -n "$NUMERO" ]; then
            python3 scripts/enviar_push.py --comunicado "$NUMERO"
          else
            if [ -z "$ANTES" ] || ! git cat-file -e "$ANTES" 2>/dev/null; then ANTES=$(git rev-parse HEAD~1); fi
            python3 scripts/enviar_push.py "$ANTES" "$GITHUB_SHA" "$(git log --format=%B "$ANTES..$GITHUB_SHA")"
          fi
